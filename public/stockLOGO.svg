<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- shadow -->
  <ellipse cx="256" cy="420" rx="150" ry="22" fill="#000" opacity="0.18"/>
  <!-- box -->
  <polygon points="130,183 256,256 256,386 130,313" fill="#DBEAFE"/>
  <polygon points="256,256 382,183 382,313 256,386" fill="#93C5FD"/>
  <polygon points="256,110 382,183 256,256 130,183" fill="#FFFFFF"/>
  <!-- tape on top -->
  <polygon points="224,128 288,165 256,184 192,147" fill="#C7D2FE"/>
  <!-- barcode on right face -->
  <g transform="matrix(1,-0.58,0,1,256,256)" fill="#1E3A8A" opacity="0.85">
    <rect x="22" y="48" width="8" height="64"/>
    <rect x="38" y="48" width="4" height="64"/>
    <rect x="50" y="48" width="12" height="64"/>
    <rect x="70" y="48" width="5" height="64"/>
    <rect x="83" y="48" width="9" height="64"/>
    <rect x="100" y="48" width="4" height="64"/>
  </g>
  <!-- left face lines -->
  <g transform="matrix(1,0.58,0,1,130,183)" fill="#60A5FA" opacity="0.7">
    <rect x="24" y="52" width="78" height="9" rx="4"/>
    <rect x="24" y="72" width="52" height="9" rx="4"/>
  </g>
  <!-- check badge -->
  <circle cx="378" cy="372" r="72" fill="url(#badge)" stroke="#fff" stroke-width="12"/>
  <path d="M346,374 L369,397 L411,348" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
